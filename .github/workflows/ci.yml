name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Bash lint (syntax + shellcheck)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax check
        run: |
          bash -n SLA.sh

      - name: Install ShellCheck (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install shellcheck

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck SLA.sh

      # Actually run the script against loopback so runtime regressions
      # (e.g. bash 3.2 incompatibilities on macOS) are caught, not just lint.
      - name: Smoke test (loopback)
        env:
          SLA_TARGETS_V4: "127.0.0.1"
          SLA_TARGETS_V6: "::1"
          SLA_PROGRESS: "0"
          SLA_OUTDIR: "smoke_out"
        run: |
          bash --version | head -n1
          bash ./SLA.sh 5 100 50
          test -s smoke_out/summary.json
          test -s smoke_out/meta.txt
          test -s smoke_out/ping_v4_127.0.0.1.log
          python3 - <<'EOF'
          import json
          d = json.load(open("smoke_out/summary.json"))
          assert d["overall"] == "OK", d
          assert d["exit_code"] == 0, d
          assert d["ipv4"]["status"] == "OK", d
          print("summary.json OK:", d["ipv4"], d["ipv6"])
          EOF

      - name: Smoke test with stock bash 3.2 (macOS)
        if: runner.os == 'macOS'
        env:
          SLA_TARGETS_V4: "127.0.0.1"
          SLA_TARGETS_V6: "::1"
          SLA_PROGRESS: "0"
          SLA_OUTDIR: "smoke_out_bash32"
        run: |
          /bin/bash --version | head -n1
          /bin/bash ./SLA.sh 5 100 50
          grep -q '"overall": "OK"' smoke_out_bash32/summary.json

      - name: Exit code checks
        run: |
          set +e
          bash ./SLA.sh; rc=$?; set -e; test "$rc" -eq 64
          set +e
          SLA_TARGETS_V4="-c" SLA_OUTDIR=ec_out bash ./SLA.sh 2 100 0; rc=$?; set -e; test "$rc" -eq 64
          echo "exit code checks OK"
